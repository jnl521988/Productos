<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#7b2454">

  <title>Stock Enológico</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =====================================================
       CABECERA PRINCIPAL
  ====================================================== -->

  <header class="topbar">

    <div class="brand">

      <span class="brand-icon">🍷</span>

      <div>
        <h1>STOCK ENÓLOGICO</h1>
        <small>Productos, lotes y movimientos</small>
      </div>

    </div>


    <!-- BOTONES PRINCIPALES -->

    <div class="top-actions">

      <button
        id="btnNuevoProducto"
        class="btn primary">
        ＋ Nuevo Producto
      </button>


      <button
        id="btnExportJSON"
        class="btn">
        ↓ Exportar JSON
      </button>


      <label class="btn file-btn">

        ↑ Importar JSON

        <input
          id="inputImportJSON"
          type="file"
          accept=".json,application/json">

      </label>


      <button
        id="btnExportPDF"
        class="btn">
        📄 Exportar PDF
      </button>

    </div>

  </header>



  <main>

    <!-- =====================================================
         NAVEGACIÓN DE CLASES
    ====================================================== -->

    <nav
      id="classNav"
      class="class-nav">
    </nav>



    <!-- =====================================================
         VISTA DE PRODUCTOS POR CLASE
    ====================================================== -->

    <section
      id="viewClasses"
      class="view">


      <div class="page-head">

        <div>

          <h2 id="classTitle">
            Productos
          </h2>

          <p id="classSubtitle">
            Selecciona una clase.
          </p>

        </div>


        <!-- BUSCADOR -->

        <div class="search-wrap">

          <span>🔎</span>

          <input
            id="searchInput"
            type="search"
            placeholder="Buscar producto...">

        </div>

      </div>



      <!-- TARJETAS DE PRODUCTOS -->

      <div
        id="productGrid"
        class="product-grid">
      </div>



      <!-- RESUMEN DE LA CLASE -->

      <div
        id="classSummary"
        class="summary">
      </div>

    </section>



    <!-- =====================================================
         VISTA DETALLE DEL PRODUCTO
    ====================================================== -->

    <section
      id="viewProduct"
      class="view hidden">
    </section>



   <!-- =====================================================
     HISTORIAL GENERAL
====================================================== -->

<section 
  id="viewHistory" 
  class="view hidden">

  <div class="page-head">

    <div>

      <h2>📋 Historial</h2>

      <p>
        Entradas y consumos de todos los productos y lotes.
      </p>

    </div>

    <div class="history-actions">

      <button 
        id="btnClearHistory" 
        class="btn danger">

        🧹 Limpiar movimientos e historial

      </button>

    </div>

  </div>


  <!-- =====================================================
       FILTROS DEL HISTORIAL
  ====================================================== -->

  <div class="history-filters">

    <div class="history-search">

      <label for="historySearch">
        🔎 Buscar
      </label>

      <input
        type="search"
        id="historySearch"
        placeholder="Producto, lote, descripción..."
      >

    </div>


    <div class="history-filter">

      <label for="historyTypeFilter">
        Tipo de movimiento
      </label>

      <select id="historyTypeFilter">

        <option value="todos">
          Todos
        </option>

        <option value="entrada">
          Entradas
        </option>

        <option value="consumo">
          Consumos
        </option>

      </select>

    </div>


    <div class="history-filter">

      <label for="historyClassFilter">
        Clase
      </label>

      <select id="historyClassFilter">

        <option value="todas">
          Todas las clases
        </option>

        <option value="levadura">
          Levadura
        </option>

        <option value="nutrición">
          Nutrición
        </option>

        <option value="encima">
          Encima
        </option>

        <option value="chips fermentación">
          Chips fermentación
        </option>

        <option value="duelas">
          Duelas
        </option>

        <option value="tanino">
          Tanino
        </option>

        <option value="clarificante">
          Clarificante
        </option>

        <option value="conservante">
          Conservante
        </option>

        <option value="regulador">
          Regulador
        </option>

        <option value="otros">
          Otros
        </option>

      </select>

    </div>

  </div>


  <!-- TABLA HISTORIAL -->

  <div 
    id="historyTable" 
    class="table-card">
  </div>

</section>



  <!-- =====================================================
       MODAL NUEVO / EDITAR PRODUCTO
  ====================================================== -->

  <div
    id="modal"
    class="modal hidden">


    <div class="modal-box">


      <div class="modal-head">

        <h3 id="modalTitle">
          Nuevo Producto
        </h3>


        <button
          class="icon-btn"
          data-close-modal>
          ×
        </button>

      </div>



      <form id="productForm">


        <input
          type="hidden"
          id="productId">



        <div class="form-grid">


          <!-- NOMBRE -->

          <label>

            Nombre

            <input
              id="fNombre"
              required>

          </label>



          <!-- PROVEEDOR -->

          <label>

            Proveedor

            <select
              id="fProveedor"
              required>
            </select>

          </label>



          <!-- CLASE -->

          <label>

            Clase

            <select
              id="fClase"
              required>
            </select>

          </label>



          <!-- UNIDAD -->

          <label>

            Unidad

            <select
              id="fUnidad"
              required>
            </select>

          </label>



          <!-- DOSIS -->

          <label>

            Dosis Recomendada

            <input
              id="fDosis"
              placeholder="Ej.: 20–40 g/hL">

          </label>



          <!-- AVISO BAJO STOCK -->

          <label>

            Aviso de Bajo Stock

            <input
              id="fBajoStock"
              type="number"
              min="0"
              step="any"
              value="0">

          </label>



          <!-- CARACTERÍSTICAS -->

          <label class="full">

            Características

            <textarea
              id="fCaracteristicas"
              rows="4">
            </textarea>

          </label>

        </div>



        <!-- BOTONES -->

        <div class="modal-foot">

          <button
            type="button"
            class="btn"
            data-close-modal>

            Cancelar

          </button>


          <button
            type="submit"
            class="btn primary">

            Guardar Producto

          </button>

        </div>

      </form>

    </div>

  </div>



  <!-- =====================================================
       MODAL NUEVO / EDITAR LOTE
  ====================================================== -->

  <div
    id="lotModal"
    class="modal hidden">


    <div class="modal-box small">


      <div class="modal-head">

        <h3 id="lotModalTitle">
          Nuevo Lote
        </h3>


        <button
          class="icon-btn"
          data-close-lot-modal>

          ×

        </button>

      </div>



      <form id="lotForm">


        <input
          type="hidden"
          id="lotProductId">


        <input
          type="hidden"
          id="lotId">



        <!-- NOMBRE / NÚMERO DEL LOTE -->

        <label>

          Número / identificación del lote

          <input
            id="lotNombre"
            required>

        </label>



        <!-- CANTIDAD INICIAL -->

        <label>

          Cantidad Inicial

          <input
            id="lotCantidad"
            type="number"
            min="0"
            step="any"
            required>

        </label>



        <div class="modal-foot">

          <button
            type="button"
            class="btn"
            data-close-lot-modal>

            Cancelar

          </button>


          <button
            class="btn primary"
            type="submit">

            Guardar Lote

          </button>

        </div>

      </form>

    </div>

  </div>



  <!-- =====================================================
       MODAL ENTRADA / CONSUMO
  ====================================================== -->

  <div
    id="movementModal"
    class="modal hidden">


    <div class="modal-box small">


      <div class="modal-head">

        <h3 id="movementModalTitle">
          Movimiento
        </h3>


        <button
          class="icon-btn"
          data-close-movement-modal>

          ×

        </button>

      </div>



      <form id="movementForm">


        <input
          type="hidden"
          id="movementId">


        <input
          type="hidden"
          id="movementProductId">


        <input
          type="hidden"
          id="movementLotId">



        <!-- TIPO -->

        <label>

          Tipo

          <select id="movementTipo">

            <option value="entrada">
              Entrada
            </option>

            <option value="consumo">
              Consumo
            </option>

          </select>

        </label>



        <!-- CANTIDAD -->

        <label>

          Cantidad

          <input
            id="movementCantidad"
            type="number"
            min="0.000001"
            step="any"
            required>

        </label>



        <!-- FECHA -->

        <label>

          Fecha

          <input
            id="movementFecha"
            type="date"
            required>

        </label>



        <!-- DESCRIPCIÓN -->

        <label>

          Descripción / Observaciones

          <textarea
            id="movementDescripcion"
            rows="3">
          </textarea>

        </label>



        <div class="modal-foot">

          <button
            type="button"
            class="btn"
            data-close-movement-modal>

            Cancelar

          </button>


          <button
            class="btn primary"
            type="submit">

            Guardar Movimiento

          </button>

        </div>

      </form>

    </div>

  </div>



  <!-- =====================================================
       AVISOS
  ====================================================== -->

  <div
    id="toast"
    class="toast">
  </div>



  <!-- =====================================================
       LIBRERÍAS PDF
  ====================================================== -->

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js">
  </script>


  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.4/jspdf.plugin.autotable.min.js">
  </script>



  <!-- =====================================================
       JAVASCRIPT DEL PROGRAMA
  ====================================================== -->

  <script src="script.js"></script>

</body>
</html>
